name: CI

# Every push is tested and built. A v* tag on a commit on main is also released: the MSIs and the .deb go to a
# GitHub release, and the issuer image to ghcr.io.
on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The version is read once here and handed to every other job as environment variables, which
  # build/Version.targets takes instead of running git describe. So the other jobs need no history.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      deb-version: ${{ steps.v.outputs.deb-version }}
      commit: ${{ steps.v.outputs.commit }}
      commits-since-tag: ${{ steps.v.outputs.commits-since-tag }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # All history and tags: git describe finds the nearest tag, and the release check needs origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: v
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The pushed tag is the version, even when a prerelease tag shares its commit and git describe
            # would pick that one. Version.targets still checks its form.
            export ProofVersion="${GITHUB_REF_NAME#v}"
          fi
          dotnet msbuild build/Version.proj -t:ProofVersion \
            -getProperty:ProofVersion -getProperty:ProofDebVersion -getProperty:ProofMsiVersion \
            -getProperty:ProofCommit -getProperty:ProofCommitsSinceTag > "$RUNNER_TEMP/version.json"
          jq . "$RUNNER_TEMP/version.json"
          jq -r '.Properties | "version=\(.ProofVersion)", "deb-version=\(.ProofDebVersion)", "commit=\(.ProofCommit)", "commits-since-tag=\(.ProofCommitsSinceTag)"' \
            "$RUNNER_TEMP/version.json" >> "$GITHUB_OUTPUT"
          version=$(jq -r .Properties.ProofVersion "$RUNNER_TEMP/version.json")

          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              release=true
            else
              echo "::warning::$GITHUB_REF_NAME is not on main, so it is built but not released."
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      ProofVersion: ${{ needs.version.outputs.version }}
      ProofCommit: ${{ needs.version.outputs.commit }}
      ProofCommitsSinceTag: ${{ needs.version.outputs.commits-since-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # CI=true turns on RestoreLockedMode (Directory.Build.props), so a stale lock file fails here.
      - run: dotnet test --solution Proof.slnx -c Release

  windows:
    name: Windows installers
    needs: version
    runs-on: windows-latest
    env:
      ProofVersion: ${{ needs.version.outputs.version }}
      ProofCommit: ${{ needs.version.outputs.commit }}
      ProofCommitsSinceTag: ${{ needs.version.outputs.commits-since-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build installer/Proof.Refresher.Installer/Proof.Refresher.Installer.wixproj -c Release
      - run: dotnet build installer/Proof.Client.Installer/Proof.Client.Installer.wixproj -c Release
      - shell: bash
        run: |
          mkdir dist
          cp installer/Proof.Refresher.Installer/bin/Release/proof-refresher.msi "dist/proof-refresher-$ProofVersion-x64.msi"
          cp installer/Proof.Client.Installer/bin/Release/proof.msi "dist/proof-$ProofVersion-x64.msi"
      # The runner is elevated and thrown away afterwards, which the script needs.
      - name: Install and remove both MSIs
        shell: pwsh
        run: |
          installer/Test-Installers.ps1 `
            -RefresherMsi "dist/proof-refresher-$env:ProofVersion-x64.msi" `
            -ClientMsi "dist/proof-$env:ProofVersion-x64.msi" `
            -ExpectedVersion "$env:ProofVersion+$env:ProofCommit"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Debian package
    needs: version
    runs-on: ubuntu-latest
    env:
      ProofVersion: ${{ needs.version.outputs.version }}
      ProofCommit: ${{ needs.version.outputs.commit }}
      ProofCommitsSinceTag: ${{ needs.version.outputs.commits-since-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/Proof.Client -c Release -r linux-x64 -p:DebugType=none -o publish/linux-x64
      - run: packaging/debian/build-deb.sh publish/linux-x64 "${{ needs.version.outputs.deb-version }}" amd64 dist
      - name: Install and remove the package
        run: |
          set -euo pipefail
          deb=$(ls dist/proof_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          # Recommends would pull in the Hyper-V daemons, which a runner has no use for.
          sudo apt-get install -y --no-install-recommends "./$deb"
          test "$(proof --version)" = "$ProofVersion+$ProofCommit"
          sudo apt-get remove -y proof
          if command -v proof; then echo "proof is still installed" >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  image:
    name: Issuer image
    # Pushing cannot be taken back, so the image waits for the tests.
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Proof.Issuer/Dockerfile
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ needs.version.outputs.commit }}
          load: true
          tags: proof-issuer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Starts the image with a fresh signing key and no allowlist: it should serve its keys and report live but
      # not ready.
      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p smoke/signing smoke/allowlist
          openssl ecparam -name prime256v1 -genkey -noout -out smoke/signing/signing-key.pem
          chmod 0644 smoke/signing/signing-key.pem
          docker run -d --name issuer -p 8080:8080 \
            -e Proof__IssuerUrl=https://id.example.test \
            -v "$PWD/smoke/signing:/etc/proof/signing:ro" \
            -v "$PWD/smoke/allowlist:/etc/proof/allowlist:ro" \
            proof-issuer:test
          trap 'docker logs issuer' EXIT
          for _ in $(seq 30); do curl -fsS http://localhost:8080/healthz/live && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz/live
          curl -fsS http://localhost:8080/.well-known/openid-configuration | jq -e '.issuer == "https://id.example.test"'
          curl -fsS http://localhost:8080/.well-known/jwks.json | jq -e '.keys | length == 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz/ready)" = 503
      - if: needs.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.version.outputs.release == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/charlespick/proof-issuer
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - if: needs.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Proof.Issuer/Dockerfile
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ needs.version.outputs.commit }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    if: needs.version.outputs.release == 'true'
    needs: [version, test, windows, linux, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
